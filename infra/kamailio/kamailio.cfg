#!KAMAILIO
#
# Kamailio 5.6 configuration for Capsy telephony platform.
#
# Routes SIP INVITEs to FreeSWITCH pool via round-robin dispatcher.
# Health checks FreeSWITCH nodes via SIP OPTIONS every 10s.
# Rate-limits inbound calls via pike module.
#

####### Global Parameters #########

debug=2
log_stderror=no
log_facility=LOG_LOCAL0

fork=yes
children=8

listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060

tcp_connection_lifetime=3605

####### Modules Section #########

loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "sanity.so"
loadmodule "dispatcher.so"
loadmodule "pike.so"

# Dispatcher: round-robin to FreeSWITCH nodes, OPTIONS health check every 10s
modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
modparam("dispatcher", "ds_ping_interval", 10)
modparam("dispatcher", "ds_ping_from", "sip:kamailio@localhost")
modparam("dispatcher", "ds_probing_mode", 1)

# Rate limiting: 50 calls per second
modparam("pike", "sampling_time_unit", 1)
modparam("pike", "reqs_density_per_unit", 50)
modparam("pike", "remove_latency", 4)

####### Routing Logic #########

request_route {
    if (!mf_process_maxfwd_header(10)) {
        sl_send_reply(483, "Too Many Hops");
        exit;
    }
    if (!sanity_check()) {
        exit;
    }

    if (!pike_check_req()) {
        sl_send_reply(503, "Service Unavailable - Rate Limit");
        exit;
    }

    if (is_method("REGISTER")) {
        route(JIO_REGISTER);
        exit;
    }

    if (is_method("OPTIONS") && uri==myself) {
        sl_send_reply(200, "OK");
        exit;
    }

    if (is_method("INVITE")) {
        route(DISPATCH);
        exit;
    }

    if (has_totag()) {
        route(WITHINDLG);
        exit;
    }

    sl_send_reply(501, "Not Implemented");
}

route[JIO_REGISTER] {
    # Jio SIP uses IP-based registration — no auth challenge needed.
    # Real deployment: restrict to Jio IP CIDR via ACL module.
    sl_send_reply(200, "OK");
}

route[DISPATCH] {
    if (!ds_select_dst(1, 4)) {
        sl_send_reply(503, "No Available Upstream");
        exit;
    }
    t_relay();
    exit;
}

route[WITHINDLG] {
    if (!loose_route()) {
        sl_send_reply(404, "Not Found");
        exit;
    }
    t_relay();
    exit;
}

failure_route[MANAGE_FAILURE] {
    if (t_is_canceled()) {
        exit;
    }
    if (t_check_status("5[0-9][0-9]")) {
        if (ds_next_dst()) {
            t_relay();
            exit;
        }
    }
}
