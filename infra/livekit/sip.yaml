# LiveKit SIP service config — localhost-only deploy unit.
#
# Secrets are injected at runtime from environment variables sourced from
# /opt/livekit/.env (chmod 600 on the box). This file contains ${ENV_VAR}
# placeholders only and is safe to commit.
#
# SIP/media-enable unit: sip_port (5060/udp) and a NARROW RTP range
# (10000-10200/udp) are now published to the host in docker-compose.yml and
# allowlisted via UFW to Vobiz IPs ONLY. No port is opened to 0.0.0.0. The box
# remains default-deny inbound; only SSH/22 is globally reachable.

# WebSocket URL to the LiveKit server. Over the private compose bridge the
# server is reachable by service name. On the host, 7880 is published on
# 127.0.0.1 only.
ws_url: ws://livekit-server:7880

api_key: ${LIVEKIT_API_KEY}
api_secret: ${LIVEKIT_API_SECRET}

redis:
  address: redis:6379
  password: ${REDIS_PASSWORD}

# SIP signaling port (published to host + UFW-allowlisted to Vobiz only).
sip_port: 5060

# RTP media port range — NARROWED to 200 ports (was 10000-20000). Published to
# host + UFW-allowlisted to Vobiz only. Caps the externally reachable media
# surface to 201 UDP ports.
rtp_port: 10000-10200

# Advertise the box's public IPv4 so SDP/RTP candidates are routable for the
# outbound PSTN SIP path to Vobiz.
use_external_ip: true

logging:
  level: info
  json: false
