[project]
name = "voice-agent-worker"
version = "0.1.0"
description = "Voice agent worker for Capsy — asyncio WebSocket server, STT→LLM→TTS pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "redis[asyncio]>=5.0.0",
    "structlog>=24.1.0",
    "evs-common",
    "stt-router",
    "llm-router",
    "tts-router",
    "guardrail",
]

[tool.uv.sources]
evs-common = { workspace = true }
stt-router = { workspace = true }
llm-router = { workspace = true }
tts-router = { workspace = true }
guardrail = { workspace = true }

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "fakeredis[aioredis]>=2.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["voice_agent"]
