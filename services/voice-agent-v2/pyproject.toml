[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-agent-v2"
version = "0.1.0"
description = "LiveKit + Pipecat voice agent (clean rebuild against real API)"
requires-python = ">=3.11"
dependencies = [
    # Core pipecat with LiveKit transport + ElevenLabs TTS + Silero VAD
    # Silero pulls torch which can be heavy on Windows — see requirements.txt notes
    "pipecat-ai[livekit,elevenlabs,silero]",
    "livekit",
    "livekit-agents",
    # Config / utils
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "redis[asyncio]>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
