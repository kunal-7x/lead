[project]
name = "stt-router"
version = "0.1.0"
description = "Speech-to-text routing service for Capsy — Sarvam Saarika (primary) + IndicConformer + Whisper fallbacks"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "pydantic>=2.6.0",
    "httpx[http2]>=0.27.0",
    "redis[asyncio]>=5.0.0",
    "python-multipart>=0.0.9",
    "structlog>=24.1.0",
    "evs-common",
]

[tool.uv.sources]
evs-common = { workspace = true }

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "fakeredis[aioredis]>=2.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["stt_router"]
