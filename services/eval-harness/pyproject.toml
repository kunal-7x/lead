[project]
name = "eval-harness"
version = "0.1.0"
description = "Deterministic AI evaluation and prompt promotion harness for Capsy"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "pytest-cov>=5",
]
