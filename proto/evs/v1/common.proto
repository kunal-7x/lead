syntax = "proto3";

package evs.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/lead/libs/go/pb/evs/v1;evsv1";

// Money represents a monetary amount with a 3-letter ISO 4217 currency code.
message Money {
  string currency_code = 1;
  int64 units = 2;
  int32 nanos = 3;
}

// Pagination request parameters; cursor based.
message PageRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message PageResponse {
  string next_page_token = 1;
  int32 total_size = 2;
}

// AuditActor identifies the principal that initiated a state change.
message AuditActor {
  string actor_id = 1;
  string actor_type = 2; // "user" | "service" | "system" | "agent"
  string tenant_id = 3;
  string display_name = 4;
}

message Tenant {
  string id = 1;
  string name = 2;
  string region = 3;
  google.protobuf.Timestamp created_at = 4;
  TenantStatus status = 5;
}

enum TenantStatus {
  TENANT_STATUS_UNSPECIFIED = 0;
  TENANT_STATUS_ACTIVE = 1;
  TENANT_STATUS_SUSPENDED = 2;
  TENANT_STATUS_DELETED = 3;
}

message User {
  string id = 1;
  string tenant_id = 2;
  string email = 3;
  string display_name = 4;
  repeated string roles = 5;
  google.protobuf.Timestamp created_at = 6;
}

message Contact {
  string id = 1;
  string tenant_id = 2;
  string phone_e164 = 3;
  string email = 4;
  string full_name = 5;
  map<string, string> attributes = 6;
}

message Lead {
  string id = 1;
  string tenant_id = 2;
  string contact_id = 3;
  string source = 4;
  string status = 5;
  string assigned_user_id = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  map<string, string> attributes = 9;
}

message Opportunity {
  string id = 1;
  string tenant_id = 2;
  string lead_id = 3;
  Money value = 4;
  string stage = 5;
  google.protobuf.Timestamp expected_close_at = 6;
}

message CallSession {
  string id = 1;
  string tenant_id = 2;
  string lead_id = 3;
  string direction = 4; // "inbound" | "outbound"
  string provider = 5;  // "plivo" | "livekit"
  string status = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp ended_at = 8;
  int32 duration_seconds = 9;
  string recording_url = 10;
}

message WhatsAppMessage {
  string id = 1;
  string tenant_id = 2;
  string contact_id = 3;
  string wa_message_id = 4;
  string direction = 5;
  string text = 6;
  string template_name = 7;
  google.protobuf.Timestamp sent_at = 8;
}

message ConsentRecord {
  string id = 1;
  string tenant_id = 2;
  string contact_id = 3;
  string channel = 4; // "voice" | "whatsapp" | "email" | "sms"
  string status = 5;  // "granted" | "revoked"
  string source = 6;
  google.protobuf.Timestamp recorded_at = 7;
}
