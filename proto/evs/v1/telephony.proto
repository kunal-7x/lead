syntax = "proto3";
package evs.v1;
import "evs/v1/common.proto";
option go_package = "github.com/lead/libs/go/pb/evs/v1;evsv1";

service TelephonyService {
  rpc PlaceCall(PlaceCallRequest) returns (PlaceCallResponse);
  rpc HangupCall(HangupCallRequest) returns (HangupCallResponse);
  rpc GetCall(GetCallRequest) returns (GetCallResponse);
  rpc ListCalls(ListCallsRequest) returns (ListCallsResponse);
  rpc HandleProviderWebhook(HandleProviderWebhookRequest) returns (HandleProviderWebhookResponse);
}

message PlaceCallRequest { string tenant_id = 1; string contact_id = 2; string from_e164 = 3; string to_e164 = 4; string campaign_id = 5; }
message PlaceCallResponse { CallSession call = 1; }
message HangupCallRequest { string tenant_id = 1; string call_id = 2; }
message HangupCallResponse {}
message GetCallRequest { string tenant_id = 1; string call_id = 2; }
message GetCallResponse { CallSession call = 1; }
message ListCallsRequest { string tenant_id = 1; PageRequest page = 2; }
message ListCallsResponse { repeated CallSession calls = 1; PageResponse page = 2; }
message HandleProviderWebhookRequest { string provider = 1; bytes body = 2; map<string, string> headers = 3; }
message HandleProviderWebhookResponse {}
