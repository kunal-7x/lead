[project]
name = "lead-python-workspace"
version = "0.0.0"
description = "Python workspace root (uv)"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["libs/python/evs_common", "services/stt-router", "services/llm-router", "services/guardrail", "services/tts-router", "services/voice-agent-worker", "services/scoring", "services/eval-harness"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
